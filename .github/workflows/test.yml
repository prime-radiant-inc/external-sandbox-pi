name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22'
          - os: ubuntu-latest
            node-version: '24'
          - os: macos-latest
            node-version: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The tests' stand-in sandbox runs the guest helper with uv's Python and ripgrep.
      # 3.12 is the oldest Python the helper supports.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep; else sudo apt-get install -y ripgrep; fi
      - run: npm ci
      - run: npm run check
      - run: npm test
